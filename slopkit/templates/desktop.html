<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Terminal desktop for the climax zoom-out (slopkit/zoomout.py). Two layers, rendered once at 3x:
     layer 'bg': wallpaper + every other window; layer 'chrome': only the main window's frame (its content area stays
     transparent, the live painting goes underneath). Spec: {layer, main: {x, y, w, h, title}, windows: [{x, y, w, h,
     title, img, lines}], prompt: {text}}. main.{x,y,w,h} is the CONTENT rect (16:9) in 1920x1080 coordinates. -->
<style>
  @font-face { font-family: "JB"; src: url("fonts/JetBrainsMono-wght.ttf"); font-weight: 100 800; }
  @font-face { font-family: "Inter"; src: url("fonts/Inter-wght.ttf"); font-weight: 100 900; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #wall { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, #22170e 0%, #0B0806 72%);
          font-family: "JB", monospace; color: #EFE6D2; }
  #wall::after { content: ''; position: absolute; inset: 0; opacity: 0.10;
                 background: radial-gradient(circle, rgba(217,178,95,0.9) 1px, transparent 1.5px) 0 0 / 48px 48px;
                 mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.6), transparent 72%); }
  .win { position: absolute; box-sizing: content-box; border: 1px solid rgba(239, 230, 210, 0.22); background: rgba(18, 12, 8, 0.90);
         border-radius: 0 0 10px 10px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); font-family: "JB", monospace; color: #EFE6D2; }
  .win .tb { position: absolute; left: 0; right: 0; top: -40px; height: 40px; background: rgba(34, 24, 16, 0.96); border: 1px solid rgba(239, 230, 210, 0.22);
             border-bottom-color: rgba(239, 230, 210, 0.10); border-radius: 10px 10px 0 0; margin: 0 -1px; box-sizing: border-box; font-size: 18px;
             line-height: 38px; padding-left: 76px; white-space: nowrap; overflow: hidden; color: rgba(239, 230, 210, 0.64); letter-spacing: 0.02em; }
  .win .tb i { position: absolute; top: 15px; width: 9px; height: 9px; border-radius: 50%; background: rgba(239, 230, 210, 0.22); }
  .win .tb i:first-of-type { background: rgba(217, 178, 95, 0.6); }
  .win img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .win .txt { padding: 12px 16px; font-size: 18px; line-height: 1.35; white-space: pre; overflow: hidden; height: 100%; box-sizing: border-box; color: #D9B25F; font-weight: 350; }
  #main { background: transparent; }
  #prompt { position: absolute; left: 0; right: 0; bottom: -64px; height: 56px; font-size: 30px; line-height: 56px; color: #EFE6D2;
            font-family: "JB", monospace; white-space: nowrap; }
</style>
<script src="common.js"></script>
</head>
<body>
<div id="wall"></div>
<script>
window.setSpec = function (spec) {
  const wall = document.getElementById('wall');
  wall.innerHTML = '';
  const bg = spec.layer !== 'chrome';
  wall.style.background = bg ? '' : 'transparent';
  if (!bg) wall.classList.add('chrome');
  const mkwin = (w, id) => {
    const d = document.createElement('div'); d.className = 'win'; if (id) d.id = id;
    Object.assign(d.style, {left: w.x + 'px', top: w.y + 'px', width: w.w + 'px', height: w.h + 'px'});
    const tb = document.createElement('div'); tb.className = 'tb'; tb.textContent = w.title || '';
    [18, 35, 52].forEach(x => { const i = document.createElement('i'); i.style.left = x + 'px'; tb.appendChild(i); });
    d.appendChild(tb);
    if (w.img) { const im = document.createElement('img'); im.src = w.img; d.appendChild(im); }
    if (w.lines) { const tx = document.createElement('div'); tx.className = 'txt'; tx.textContent = w.lines.join('\n'); d.appendChild(tx); }
    wall.appendChild(d); return d;
  };
  if (bg) (spec.windows || []).forEach(w => mkwin(w));
  else { mkwin(spec.main, 'main'); }
  if (bg && spec.prompt) { /* the prompt line under the main window lives in the UI layer (typed), not here */ }
  if (!bg) { const s = document.createElement('style'); s.textContent = '#wall::after{display:none}'; document.head.appendChild(s); }
  return Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
};
window.renderAt = function (t) {};
</script>
</body>
</html>
