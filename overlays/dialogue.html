<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Character dialogue box (the reviewer's final-cut review: character lines are on-screen text, not voiced).
     A game-style dialogue panel with the speaker's name tag in the character's colour, so it never reads as the
     dialogue box. Rendered frame-by-frame by pipeline/overlay.py; window.renderAt(t) sets the state for time t. -->
<style>
  @font-face { font-family: "Orbitron"; src: url("fonts/Orbitron-wght.ttf"); font-weight: 400 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-wght.ttf"); font-weight: 100 800; }
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  .dlg {
    position: absolute; box-sizing: border-box; min-width: 520px; max-width: 1240px;
    background: var(--fill); border: 2px solid var(--accent); border-radius: 18px;
    box-shadow: 0 0 16px 1px var(--glow), 0 8px 26px rgba(0, 0, 0, 0.45);
    color: #FFF6EE; font-family: "JetBrains Mono", monospace; font-weight: 600;
    padding: 34px 40px 28px; transform-origin: 50% 100%;
  }
  .tag {
    position: absolute; left: 28px; top: -24px; padding: 6px 18px 5px; border-radius: 10px;
    background: var(--accent); color: #1A0F14; font-family: "Orbitron", sans-serif; font-weight: 800;
    font-size: 26px; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .text { font-size: 38px; line-height: 1.35; white-space: pre-wrap; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); }
  .caret { display: inline-block; width: 0.55em; background: #FFF6EE; opacity: 0.8; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// {speaker, text, x, y (bottom edge), accent, fill, glow, t_in, t_out, type_cps}
let BOX = null;
const POP_IN = 0.14, POP_OUT = 0.18;
function ease(u) { return 1 - Math.pow(1 - u, 3); }
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

window.setBox = function (box) {
  BOX = box;
  const st = document.getElementById("stage");
  st.innerHTML = "";
  const el = document.createElement("div");
  el.className = "dlg"; el.id = "dlg";
  el.style.setProperty("--accent", box.accent);
  el.style.setProperty("--fill", box.fill);
  el.style.setProperty("--glow", box.glow);
  el.innerHTML = `<div class="tag">${esc(box.speaker)}</div><div class="text" id="text"></div>`;
  st.appendChild(el);
  el.querySelector("#text").textContent = box.text;  // measure with the full line so typing never resizes it
  const r = el.getBoundingClientRect();
  el.style.width = r.width + "px"; el.style.height = r.height + "px";
  el.style.left = (box.x - r.width / 2) + "px";
  el.style.top = (box.y - r.height) + "px";
  return true;
};

window.renderAt = function (t) {
  const el = document.getElementById("dlg");
  if (t < BOX.t_in || t >= BOX.t_out + POP_OUT) { el.style.visibility = "hidden"; return; }
  el.style.visibility = "visible";
  let s = 1, o = 1, dy = 0;
  if (t < BOX.t_in + POP_IN) { const u = ease((t - BOX.t_in) / POP_IN); s = 0.92 + 0.08 * u; o = u; dy = 12 * (1 - u); }
  if (t >= BOX.t_out) { const u = (t - BOX.t_out) / POP_OUT; o = 1 - u; dy = 8 * u; }
  el.style.opacity = o;
  el.style.transform = `translateY(${dy}px) scale(${s})`;
  const txt = BOX.text;
  const n = BOX.type_cps ? Math.max(0, Math.min(txt.length, Math.floor((t - BOX.t_in) * BOX.type_cps))) : txt.length;
  const caret = n < txt.length ? '<span class="caret">&nbsp;</span>' : "";
  document.getElementById("text").innerHTML = esc(txt.slice(0, n)) + caret;
};
</script>
</body>
</html>
